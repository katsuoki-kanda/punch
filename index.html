<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIパンチングゲーム</title>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
            color: white;
            user-select: none;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* 鏡のように左右反転して表示 */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        /* UI部分 */
        #ui-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 20px 50px;
            box-sizing: border-box;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 3px 3px 5px rgba(0,0,0,0.8);
            z-index: 10;
        }
        #score { color: #ffd700; }
        #timer { color: #ff4d4d; }
        
        #message-area {
            position: absolute;
            top: 120px;
            width: 100%;
            text-align: center;
            font-size: 36px;
            font-weight: bold;
            text-shadow: 3px 3px 5px rgba(0,0,0,0.8);
            z-index: 10;
        }
        
        #main-msg {
            font-size: 50px;
            color: #00ffff;
            margin-bottom: 10px;
        }
        
        #sub-msg {
            font-size: 28px;
            color: #ffffff;
        }

        /* ゲームオーバー時の画面 */
        #game-over-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }
        #game-over-screen h1 {
            font-size: 70px;
            color: #ff4d4d;
            margin-bottom: 20px;
        }
        #final-score {
            font-size: 40px;
            margin-bottom: 30px;
        }
        #retry-msg {
            font-size: 28px;
            color: #00ffff;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0,255,255,0.5);
            animation: blink 1.5s infinite alternate;
        }
        @keyframes blink {
            0% { opacity: 0.4; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="container">
        <video id="input_video" style="display:none;" playsinline></video>
        
        <canvas id="output_canvas"></canvas>

        <div id="ui-header">
            <div id="score">SCORE: 0</div>
            <div id="timer">TIME: 60</div>
        </div>

        <div id="message-area">
            <div id="main-msg">カメラ起動中</div>
            <div id="sub-msg"></div>
        </div>

        <div id="game-over-screen">
            <h1>GAME OVER</h1>
            <div id="final-score">SCORE: 0</div>
            <div id="retry-msg">手を顔より高く上げてリトライ！</div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        
        const timerEl = document.getElementById('timer');
        const scoreEl = document.getElementById('score');
        const mainMsgEl = document.getElementById('main-msg');
        const subMsgEl = document.getElementById('sub-msg');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreEl = document.getElementById('final-score');

        // ゲームステート
        let gameMode = "TITLE"; 
        let score = 0;
        let timeLeft = 60;
        let timerId = null;
        let gameoverTimestamp = 0;
        let cameraReady = false; 
        
        let leftTarget = "GOOD"; 
        let rightTarget = "GOOD";
        let audioCtx = null;

        // お手付き検出管理用の変数 (ミリ秒タイムスタンプで制御)
        let penaltyStartTime = 0;          // 最初にお手付きを検出した時刻
        let leftHandMistakeDetected = false;  // 左手でお手付きしたフラグ
        let rightHandMistakeDetected = false; // 右手でお手付きしたフラグ
        const PENALTY_HOLD_DURATION = 150;    // 保持時間を0.15秒（150ミリ秒）に変更

        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function speak(text) {
            window.speechSynthesis.cancel();
            const uttr = new SpeechSynthesisUtterance(text);
            uttr.lang = 'ja-JP';
            window.speechSynthesis.speak(uttr);
        }

        function playCorrectSound() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(1000, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.3);
        }

        function playIncorrectSound() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
            oscillator.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.2);
        }

        function startGame() {
            gameMode = "PLAYING";
            score = 0;
            timeLeft = 60;
            scoreEl.innerText = `SCORE: ${score}`;
            timerEl.innerText = `TIME: ${timeLeft}`;
            resetPenaltyState();
            spawnQuestion();
            
            speak("悪魔をパンチしてね天使はだめよ");
            timerId = setInterval(() => {
                timeLeft--;
                timerEl.innerText = `TIME: ${timeLeft}`;
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        function resetPenaltyState() {
            penaltyStartTime = 0;
            leftHandMistakeDetected = false;
            rightHandMistakeDetected = false;
        }

        function spawnQuestion() {
            const types = ["GOOD", "BAD"];
            leftTarget = types[Math.floor(Math.random() * 2)];
            rightTarget = types[Math.floor(Math.random() * 2)];
            gameMode = "PLAYING";
            resetPenaltyState();
            mainMsgEl.innerText = "ターゲット出現！";
            mainMsgEl.style.color = "#00ffff";
            subMsgEl.innerText = "悪魔をパンチ！天使はダメよ";
        }

        function endGame() {
            clearInterval(timerId);
            gameMode = "GAMEOVER";
            mainMsgEl.innerText = "タイムアップ！";
            subMsgEl.innerText = "";
            finalScoreEl.innerText = `最終スコア: ${score}点`;
            
            speak(`${score}点です。終了。`); 
            gameOverScreen.style.display = "flex";
            gameoverTimestamp = Date.now();
        }

        // MediaPipe ポーズ検出のコールバック
        function onResults(results) {
            if (!cameraReady) {
                cameraReady = true;
                if (gameMode === "TITLE") {
                    mainMsgEl.innerText = "手を顔より高く上げてスタート！";
                }
            }

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.poseLandmarks) {
                const landmarks = results.poseLandmarks;
                const nose = landmarks[0];
                const leftWrist = landmarks[15];
                const rightWrist = landmarks[16];

                // パンチ判定（手首が鼻の位置より上にある）
                const leftPunch = leftWrist.y < nose.y;
                const rightPunch = rightWrist.y < nose.y;

                // パンチしていない状態（手首が鼻の位置より下にある）
                const leftPulled = leftWrist.y > nose.y;
                const rightPulled = rightWrist.y > nose.y;

                // 交差判定
                const crossed = leftWrist.x < rightWrist.x && leftPulled && rightPulled;

                // 1. スタート・リトライ判定
                if (gameMode === "TITLE") {
                    if (leftPunch || rightPunch) {
                        gameMode = "WAITING_START_LOWER";
                        mainMsgEl.innerText = "手を下げてスタート！";
                        mainMsgEl.style.color = "#ffff00";
                    }
                }
                else if (gameMode === "GAMEOVER") {
                    const timeSinceGameover = Date.now() - gameoverTimestamp;
                    if (timeSinceGameover > 3000) {
                        if (leftPunch || rightPunch) {
                            gameOverScreen.style.display = "none";
                            gameMode = "WAITING_START_LOWER";
                            mainMsgEl.innerText = "手を下げてスタート！";
                            mainMsgEl.style.color = "#ffff00";
                        }
                    }
                }
                else if (gameMode === "WAITING_START_LOWER") {
                    if (leftPulled && rightPulled) startGame();
                }

                // 2. プレイ中
                if (gameMode === "PLAYING") {
                    let success = false;
                    const L = leftTarget;
                    const R = rightTarget;

                    // --- 正解判定 ---
                    if (L === "BAD" && R === "BAD") {
                        if (leftPunch && rightPunch) success = true;
                    } else if (L === "BAD" && R === "GOOD") {
                        if (leftPunch && rightPulled && !crossed) success = true;
                    } else if (L === "GOOD" && R === "BAD") {
                        if (leftPulled && rightPunch && !crossed) success = true;
                    } else if (L === "GOOD" && R === "GOOD") {
                        if (crossed) success = true;
                    }

                    if (success) {
                        score++;
                        scoreEl.innerText = `SCORE: ${score}`;
                        playCorrectSound();
                        mainMsgEl.innerText = "✨正解！✨";
                        mainMsgEl.style.color = "#ffff00";
                        subMsgEl.innerText = "手を引いてニュートラルに戻してください";
                        gameMode = "WAITING_NEUTRAL"; 
                    } 
                    else {
                        // --- 減点（お手付き）判定 ---
                        let flagChanged = false;

                        // 左が天使なのに、左手が上がったらフラグを立てる（その後下げても維持）
                        if (L === "GOOD" && leftPunch && !leftHandMistakeDetected) {
                            leftHandMistakeDetected = true;
                            flagChanged = true;
                        }
                        // 右が天使なのに、右手が上がったらフラグを立てる（その後下げても維持）
                        if (R === "GOOD" && rightPunch && !rightHandMistakeDetected) {
                            rightHandMistakeDetected = true;
                            flagChanged = true;
                        }

                        // いずれかの手で新しくお手付きを開始した場合、計測タイマーを始動
                        if (flagChanged && penaltyStartTime === 0) {
                            penaltyStartTime = Date.now();
                        }

                        // お手付きが始まっている場合の処理
                        if (penaltyStartTime > 0) {
                            const elapsed = Date.now() - penaltyStartTime;

                            // 減点確定の条件：
                            // 1. 両方が天使（GOOD）の状態で、両方のミスフラグが揃った
                            // 2. または、最初のミスから規定のホールド時間（150ms）が経過した
                            const bothAngels = (L === "GOOD" && R === "GOOD");
                            const bothFlgSet = (leftHandMistakeDetected && rightHandMistakeDetected);

                            if (bothFlgSet || elapsed >= PENALTY_HOLD_DURATION) {
                                // 最終的な減点数を計算
                                let finalPenalty = 0;
                                if (leftHandMistakeDetected) finalPenalty++;
                                if (rightHandMistakeDetected) finalPenalty++;

                                // スコア更新と通知
                                score -= finalPenalty;
                                scoreEl.innerText = `SCORE: ${score}`;
                                playIncorrectSound();
                                mainMsgEl.innerText = "❌天罰！❌";
                                mainMsgEl.style.color = "#ff4d4d";
                                subMsgEl.innerText = "手を引いてニュートラルに戻してください";
                                speak("天罰です。減点");
                                gameMode = "WAITING_NEUTRAL";
                            }
                        }
                    }
                } 
                else if (gameMode === "WAITING_NEUTRAL") {
                    if (leftPulled && rightPulled && !crossed) spawnQuestion();
                }
            }
            canvasCtx.restore();

            // ターゲット描画
            if (gameMode === "PLAYING" || gameMode === "WAITING_NEUTRAL") {
                const isNeutral = (gameMode === "WAITING_NEUTRAL");
                drawFace(leftTarget, canvasElement.width * 0.75, canvasElement.height * 0.5, isNeutral);
                drawFace(rightTarget, canvasElement.width * 0.25, canvasElement.height * 0.5, isNeutral);
            }
        }

        function drawFace(type, x, y, isNeutral) {
            if (isNeutral) return;
            canvasCtx.save();
            canvasCtx.translate(canvasElement.width, 0);
            canvasCtx.scale(-1, 1);
            const flippedX = canvasElement.width - x;

            // 円 (1.5倍)
            canvasCtx.beginPath();
            canvasCtx.arc(flippedX, y, 135, 0, Math.PI * 2);
            canvasCtx.fillStyle = type === "BAD" ? "rgba(255, 0, 0, 0.6)" : "rgba(0, 255, 0, 0.6)";
            canvasCtx.fill();
            canvasCtx.lineWidth = 5;
            canvasCtx.strokeStyle = "#ffffff";
            canvasCtx.stroke();

            // 文字 (1.5倍)
            canvasCtx.font = "190px Arial";
            canvasCtx.textAlign = "center";
            canvasCtx.textBaseline = "middle";
            canvasCtx.fillText(type === "BAD" ? "😈" : "😇", flippedX, y);
            canvasCtx.restore();
        }

        const pose = new Pose({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`});
        pose.setOptions({modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5});
        pose.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => { await pose.send({image: videoElement}); },
            width: 1280, height: 720
        });
        camera.start();
    </script>
</body>
</html>
